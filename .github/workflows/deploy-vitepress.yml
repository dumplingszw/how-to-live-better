# 构建 VitePress 站点并部署到 GitHub Pages
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated 要读每个文件的最后一次提交时间，浅克隆会让全书显示同一个日期
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # 单文件离线版（仓库根的 index.html，由 rebuild.yml 每日重建）放进 public/，
      # 构建时会复制进站点，线上即可通过 /legacy.html 打开。
      # 这样仓库里不必再存一份 2.3MB 的副本，也不会出现两份内容不同步。
      - name: Stage legacy single-file page
        run: |
          mkdir -p docs/public
          cp index.html docs/public/legacy.html

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
